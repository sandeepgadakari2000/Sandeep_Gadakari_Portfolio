  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

3zM10 9h3.8v1.7h.05c.53-1 1.83-2.05 3.77-2.05 4.03 0 4.78 2.65 4.78 6.1V21h-4v-5.3c0-1.26-.02-2.9-1.77-2.9-1.77 0-2.04 1.38-2.04 2.8V21h-4z\"><\u002Fpath><\u002Fsvg>LinkedIn ↗<\u002Fa>\n        <a href=\"https://github.com/sandeepgadakari2000\" target=\"_blank\" rel=\"noopener noreferrer\"><svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M12 .5A11.5 11.5 0 0 0 .5 12a11.5 11.5 0 0 0 7.86 10.92c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.36-3.88-1.36-.53-1.34-1.3-1.7-1.3-1.7-1.06-.72.08-.71.08-.71 1.17.08 1.79 1.2 1.79 1.2 1.04 1.78 2.73 1.27 3.4.97.1-.75.4-1.27.73-1.56-2.56-.29-5.26-1.28-5.26-5.7 0-1.26.45-2.29 1.2-3.1-.12-.29-.52-1.46.11-3.05 0 0 .98-.31 3.2 1.18a11.1 11.1 0 0 1 5.82 0c2.2-1.49 3.18-1.18 3.18-1.18.63 1.59.23 2.76.11 3.05.75.81 1.2 1.84 1.2 3.1 0 4.43-2.7 5.4-5.28 5.69.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 23.5 12 11.5 11.5 0 0 0 12 .5z\"><\u002Fpath><\u002Fsvg>GitHub ↗<\u002Fa>\n        <a href=\"https://public.tableau.com/app/profile/sandeep.gadakari/vizzes\" target=\"_blank\" rel=\"noopener noreferrer\"><svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><rect x=\"11.1\" y=\"2.5\" width=\"1.8\" height=\"19\"><\u002Frect><rect x=\"2.5\" y=\"11.1\" width=\"19\" height=\"1.8\"><\u002Frect><rect x=\"6.3\" y=\"6.4\" width=\"1.5\" height=\"11.2\"><\u002Frect><rect x=\"16.2\" y=\"6.4\" width=\"1.5\" height=\"11.2\"><\u002Frect><rect x=\"6.4\" y=\"16.2\" width=\"11.2\" height=\"1.5\"><\u002Frect><rect x=\"6.4\" y=\"6.3\" width=\"11.2\" height=\"1.5\"><\u002Frect><\u002Fsvg>Tableau ↗<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fdiv>\n<\u002Fmain>\n\n<div id=\"grain\"><\u002Fdiv>\n<div id=\"vignette\"><\u002Fdiv>\n\n\n\n<script type=\"importmap\">\n{\"imports\":{\"three\":\"https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js\",\"three/addons/\":\"https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/\"}}\n<\u002Fscript>\n<script type=\"module\">\n/* Three.js loads from CDN via module import. If it's unreachable (offline),\n   we fall back to the full content portfolio instead of a blank loader. */\nlet THREE=null, FontLoader=null, TextGeometry=null;\ntry{\n  THREE=await import('three');\n  ({ FontLoader }=await import('three/addons/loaders/FontLoader.js'));\n  ({ TextGeometry }=await import('three/addons/geometries/TextGeometry.js'));\n}catch(e){console.info('3D engine unavailable — showing content fallback:',e&&e.message);}\n\n/* ============================== DATA ============================== */\nconst EMAIL='sandeepgadakari2000@gmail.com';\nconst GH='https://github.com/sandeepgadakari2000';\nconst TB='https://public.tableau.com/app/profile/sandeep.gadakari/vizzes';\n// [title, description, stack[], link, type]\nconst projects=[\n  ['S&OP Automation Demo','Cinematic walkthrough: two workbooks, nine source sheets, Python processing, and a report in seconds.',['Python','Pandas','Excel / CSV'],'','internal'],\n  ['NIFTY 50 ML Forecast','CSV upload, feature engineering, Random Forest training, and a five-day forecast.',['Python','Machine Learning','Random Forest'],'https://github.com/sandeepgadakari2000/nifty50-ml-forecast','github'],\n  ['Entity Performance Intelligence','Cross-entity HR view for attendance, hiring, attrition, and headcount distribution.',['Excel / CSV','BI','Data Viz'],'','internal'],\n  ['OneSGG HR Analytics','AI-assisted attrition-risk by grade and department-headcount forecasting.',['Machine Learning','HR Analytics','Python'],'','internal'],\n  ['OneSGG HR Platform v2','Workforce planning for approved, filled, vacant roles, attrition, and AI insights.',['Workforce Planning','AI Insights','Dashboards'],'','internal'],\n  ['SGG HR Compliance','Excel-powered compliance tracking with gap and trend insights.',['Excel / CSV','Compliance','Analytics'],'','internal'],\n  ['GCL Global Org Structure','Interactive leadership-to-function org chart with live headcount analytics.',['JavaScript','Data Viz','Org Analytics'],'','internal'],\n  ['OWSR Control Tower — Coolberg','Retail control tower for outlets, revenue, metro mix, and buying-pattern heatmaps.',['Chart.js','Retail Analytics','BI'],'','internal'],\n  ['P&L Statement Dashboard','YoY performance, expenses, profitability trend, and a revenue-to-net-profit bridge.',['Tableau','Finance','Data Viz'],TB,'tableau'],\n  ['IMDb Movie Performance','Budgets, box office, ratings, certificates, and ranking-versus-rating patterns.',['Tableau','Dashboards','Analytics'],TB,'tableau'],\n  ['Game Accessories Delivery','Sales, profit, regional mix, purchase patterns, and geographic performance.',['Tableau','Sales Analytics','Data Viz'],TB,'tableau'],\n  ['Human Resources Overview','Headcount, hiring, terminations, demographics, income, and age-salary patterns.',['Tableau','HR Analytics','Dashboards'],TB,'tableau'],\n  ['Netflix Content Analysis','Country distribution, release trends, content mix, ratings, and top genres.',['Tableau','Content Analytics','Data Viz'],TB,'tableau'],\n  ['Prime Video Visualization','Geographic shows, genre mix, type split, release-year trend, and metadata.',['Tableau','Dashboards','Analytics'],TB,'tableau'],\n  ['Volcanic Eruption & Rock Type','Geospatial view of eruptions, rock types, regional elevation, and clusters.',['Tableau','Geospatial','Data Viz'],TB,'tableau'],\n  ['Amazon Sales SQL Project','SQL analysis deck documenting business questions and sales insights.',['SQL','Sales Analytics','PowerPoint'],'https://github.com/sandeepgadakari2000/Amazon_-sales','github']\n];\nconst skills=['Python','SQL','Tableau','Machine Learning','Pandas / NumPy','JavaScript','Chart.js','Excel Automation','Data Visualization','Dashboard Engineering'];\nconst tagFor=t=>t==='github'?'GITHUB ↗':t==='tableau'?'TABLEAU ↗':'CASE STUDY';\n\n/* ============================== LOADER ============================== */\nconst loader=document.getElementById('loader'), pctEl=document.getElementById('pct');\nconst squig=document.getElementById('squigglePath');\nconst sqLen=squig.getTotalLength(); squig.style.setProperty('--len',sqLen);\nlet loadProgress=0, sceneReady=false;\nfunction setProgress(p){loadProgress=Math.max(loadProgress,p);const v=Math.min(100,Math.round(loadProgress));pctEl.textContent=v+'%';squig.style.strokeDashoffset=sqLen*(1-v/100)}\n// fake ramp while the scene builds; jump to 100 once ready\nlet ramp=setInterval(()=>{ if(loadProgress<88) setProgress(loadProgress+Math.random()*9+3); },160);\nfunction finishLoad(){clearInterval(ramp);setProgress(100);setTimeout(()=>{loader.classList.add('done');document.getElementById('webgl').focus?.();},420);}\n\n/* ============================== FALLBACK CHECK ============================== */\nfunction doodleSVG(i){\n  const s='stroke=\"#2a2a2a\" fill=\"none\" stroke-width=\"2\"';const r=n=>{const x=Math.sin((i+1)*99.7+n*37.3)*1e4;return x-Math.floor(x)};const m=i%6;\n  if(m===0){let b='';for(let k=0;k<5;k++){const h=16+r(k)*56;b+=`<rect x=\"${20+k*32}\" y=\"${86-h}\" width=\"20\" height=\"${h}\" ${s}/>`}return `<svg viewBox=\"0 0 200 100\"><path d=\"M14 10V88H190\" ${s}/>${b}<\u002Fsvg>`}\n  if(m===1){let p='M20 '+(66-r(0)*38);for(let k=1;k<=6;k++)p+=` L ${20+k*27} ${66-r(k)*44}`;return `<svg viewBox=\"0 0 200 100\"><path d=\"M14 10V88H190\" ${s}/><path d=\"${p}\" ${s}/><\u002Fsvg>`}\n  if(m===2){return `<svg viewBox=\"0 0 200 100\"><circle cx=\"100\" cy=\"50\" r=\"33\" ${s}/><circle cx=\"100\" cy=\"50\" r=\"14\" ${s}/><path d=\"M100 50L133 50M100 50L112 21\" ${s}/><\u002Fsvg>`}\n  if(m===3){let d='';for(let k=0;k<10;k++)d+=`<circle cx=\"${26+r(k)*150}\" cy=\"${18+r(k+5)*64}\" r=\"4\" ${s}/>`;return `<svg viewBox=\"0 0 200 100\"><path d=\"M14 10V88H190\" ${s}/>${d}<\u002Fsvg>`}\n  if(m===4){let p='M14 88 L20 '+(70-r(0)*30);for(let k=1;k<=6;k++)p+=` L ${20+k*28} ${70-r(k)*34}`;p+=' L 186 88 Z';return `<svg viewBox=\"0 0 200 100\"><path d=\"${p}\" fill=\"rgba(42,42,42,.1)\" stroke=\"#2a2a2a\" stroke-width=\"2\"/><\u002Fsvg>`}\n  let g='';for(let a=0;a<3;a++)for(let c=0;c<6;c++){const f=r(a*6+c)>.55?'rgba(42,42,42,.16)':'none';g+=`<rect x=\"${18+c*28}\" y=\"${14+a*26}\" width=\"26\" height=\"24\" fill=\"${f}\" stroke=\"#2a2a2a\" stroke-width=\"1.4\"/>`}return `<svg viewBox=\"0 0 200 100\">${g}<\u002Fsvg>`;\n}\nconst lowPower=matchMedia('(prefers-reduced-motion: reduce)').matches||(navigator.deviceMemory&&navigator.deviceMemory<=2);\nlet renderer=null, glOK=!!THREE;\ntry{if(!THREE)throw 2;const c=document.createElement('canvas');if(!c.getContext('webgl2')&&!c.getContext('webgl'))throw 0;if(lowPower)throw 1;}catch(e){glOK=false}\n\n/* ============================== MODAL ============================== */\nconst modal=document.getElementById('modal');\nconst mNo=document.getElementById('mNo'),mTitle=document.getElementById('mTitle'),mDesc=document.getElementById('mDesc'),mStack=document.getElementById('mStack'),mP=document.getElementById('mPrimary'),mS=document.getElementById('mSecondary');\nlet lastFocus=null;\nfunction link(el,href,label,ext){el.textContent=label;el.href=href;if(ext){el.target='_blank';el.rel='noopener noreferrer'}else{el.removeAttribute('target');el.removeAttribute('rel')}}\nfunction openProject(i){lastFocus=document.activeElement;const p=projects[i];mNo.textContent=String(i+1).padStart(2,'0');mTitle.textContent=p[0];mDesc.textContent=p[1];mStack.innerHTML=p[2].map(x=>`<span>${x}<\u002Fspan>`).join('');\n  if(p[4]==='github'){link(mP,p[3],'VIEW ON GITHUB ↗',true);link(mS,`mailto:${EMAIL}?subject=${encodeURIComponent('Project: '+p[0])}`,'DISCUSS →',false)}\n  else if(p[4]==='tableau'){link(mP,p[3],'VIEW ON TABLEAU ↗',true);link(mS,`mailto:${EMAIL}?subject=${encodeURIComponent('Project: '+p[0])}`,'DISCUSS →',false)}\n  else{link(mP,`mailto:${EMAIL}?subject=${encodeURIComponent('Walkthrough: '+p[0])}`,'REQUEST A WALKTHROUGH →',false);link(mS,GH,'MORE ON GITHUB ↗',true)}\n  modal.classList.add('open');modal.setAttribute('aria-hidden','false');document.getElementById('mClose').focus()}\nfunction closeProject(){modal.classList.remove('open');modal.setAttribute('aria-hidden','true');lastFocus&&lastFocus.focus&&lastFocus.focus()}\ndocument.getElementById('mClose').onclick=closeProject;\nmodal.addEventListener('click',e=>{if(e.target===modal)closeProject()});\naddEventListener('keydown',e=>{if(e.key==='Escape')closeProject()});\n\n/* ============================== DOM FALLBACK BUILD ============================== */\nfunction buildFallback(){\n  const cards=document.getElementById('fbCards');\n  projects.forEach((p,i)=>{const b=document.createElement('button');b.className='card';b.innerHTML=`<div class=\"art\">${doodleSVG(i)}<\u002Fdiv><h3>${p[0]}<\u002Fh3><p>${p[1]}<\u002Fp><span class=\"t\">${tagFor(p[4])}<\u002Fspan>`;b.onclick=()=>openProject(i);cards.appendChild(b)});\n  const tools=document.getElementById('fbTools');skills.forEach(s=>{const e=document.createElement('span');e.textContent=s;tools.appendChild(e)});\n}\ndocument.getElementById('skipBtn').addEventListener('click',e=>{e.preventDefault();gotoFallback()});\nfunction gotoFallback(){document.getElementById('fallback').classList.add('on');document.body.style.overflow='auto';const a=document.getElementById('fb-gallery');a&&a.scrollIntoView&&a.scrollIntoView();}\n\nif(!glOK){\n  buildFallback();document.getElementById('fallback').classList.add('on');document.body.style.overflow='auto';\n  document.querySelector('.frame-ui').style.display='none';document.getElementById('webgl').style.display='none';\n  finishLoad();\n}\n\n/* ============================== THREE SCENE ============================== */\nif(glOK){\nbuildFallback(); // available behind the skip button\nconst canvas=document.getElementById('webgl');\nrenderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,preserveDrawingBuffer:true,powerPreference:'high-performance'});\nrenderer.setPixelRatio(Math.min(devicePixelRatio,1.75));\nrenderer.setSize(innerWidth,innerHeight);\n\nconst PAPER=0xf1efe9;\nconst scene=new THREE.Scene();\nscene.background=new THREE.Color(PAPER);\nscene.fog=new THREE.Fog(PAPER,26,72);\nconst camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,140);\ncamera.position.set(0,1.62,30);\n\nconst INK=new THREE.LineBasicMaterial({color:0x2a2a2a,transparent:true,opacity:.82});\nconst SOFT=new THREE.LineBasicMaterial({color:0x6f6f6b,transparent:true,opacity:.4});\nconst FAINT=new THREE.LineBasicMaterial({color:0x8f8f8a,transparent:true,opacity:.24});\nconst raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();\nconst clickable=[];\n\nfunction line(pts,mat=INK,parent=scene){const g=new THREE.BufferGeometry().setFromPoints(pts.map(p=>new THREE.Vector3(...p)));const l=new THREE.Line(g,mat);parent.add(l);return l}\nfunction edges(w,h,d,mat=INK){return new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(w,h,d)),mat)}\nfunction box(x,y,z,w,h,d,mat=INK,parent=scene){const l=edges(w,h,d,mat);l.position.set(x,y,z);parent.add(l);return l}\n\n/* ---- canvas texture helpers ---- */\nfunction tex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');draw(x,c);const t=new THREE.CanvasTexture(c);t.minFilter=THREE.LinearFilter;t.anisotropy=renderer.capabilities.getMaxAnisotropy?.()||4;return t}\nfunction rnd(seed){let s=seed;return()=>{s=Math.sin(s*127.1+311.7)*43758.5453;return s-Math.floor(s)}}\n\n// pencil label sprite (transparent) — used for scene text & signs\nfunction labelSprite(text,{size=90,color='#2a2a2a',weight='bold',pad=0.16}={}){\n  const c=document.createElement('canvas');c.width=1024;c.height=256;const x=c.getContext('2d');\n  x.clearRect(0,0,1024,256);x.fillStyle=color;x.font=`${weight} ${size}px \"Courier New\",monospace`;x.textAlign='center';x.textBaseline='middle';\n  x.fillText(text,512,132);\n  const t=new THREE.CanvasTexture(c);t.minFilter=THREE.LinearFilter;\n  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false,depthWrite:false}));\n  sp.scale.set(text.length*pad,pad*2.0,1);return sp;\n}\n\n/* ---- WOOD PLANK FLOOR ---- */\nconst floorTex=tex(512,512,(x)=>{\n  x.fillStyle='#efece4';x.fillRect(0,0,512,512);\n  // planks run along Z (vertical seams)\n  const cols=6;const R=rnd(4);\n  for(let i=0;i<=cols;i++){const px=i*(512/cols);x.strokeStyle='rgba(42,42,42,.34)';x.lineWidth=2;x.beginPath();x.moveTo(px+ (R()-.5)*3,0);x.lineTo(px+(R()-.5)*3,512);x.stroke();}\n  // grain streaks + cross seams\n  x.strokeStyle='rgba(42,42,42,.11)';x.lineWidth=1;\n  for(let i=0;i<70;i++){const gx=R()*512, gy=R()*512, len=20+R()*90;x.beginPath();x.moveTo(gx,gy);x.bezierCurveTo(gx+8,gy+len*.4,gx-6,gy+len*.7,gx+3,gy+len);x.stroke();}\n  x.strokeStyle='rgba(42,42,42,.16)';x.lineWidth=1.4;\n  for(let c=0;c<cols;c++){for(let k=0;k<3;k++){const yy=R()*512;const bx=c*(512/cols);x.beginPath();x.moveTo(bx,yy);x.lineTo(bx+512/cols,yy+(R()-.5)*4);x.stroke();}}\n});\nfloorTex.wrapS=floorTex.wrapT=THREE.RepeatWrapping;floorTex.repeat.set(4,26);\nconst floor=new THREE.Mesh(new THREE.PlaneGeometry(13,150),new THREE.MeshBasicMaterial({map:floorTex}));\nfloor.rotation.x=-Math.PI/2;floor.position.set(0,0,-40);scene.add(floor);\n// stone path leading up to the front door (outdoor approach)\nconst Rp=rnd(31);\nfor(let i=0;i<8;i++){const pz=28-i*1.95;const cx=(Rp()-.5)*0.7;const w=1.5-i*0.05;\n  line([[cx-w/2,0.02,pz],[cx+w/2,0.02,pz-0.3],[cx+w/2-0.22,0.02,pz-1.55],[cx-w/2+0.22,0.02,pz-1.35],[cx-w/2,0.02,pz]],SOFT);}\n\n/* ---- WALLS (sketchy paper with faint brick) ---- */\nconst wallTex=tex(512,256,(x)=>{\n  x.fillStyle='#f1efe9';x.fillRect(0,0,512,256);\n  x.strokeStyle='rgba(42,42,42,.14)';x.lineWidth=1.4;const R=rnd(9);\n  const bw=64,bh=30;\n  for(let row=0;row*bh<256;row++){const off=(row%2)*bw/2;for(let cx=-bw;cx<512+bw;cx+=bw){const bx=cx+off+(R()-.5)*3,by=row*bh;x.strokeRect(bx,by,bw-2,bh-2);}}\n});\nwallTex.wrapS=wallTex.wrapT=THREE.RepeatWrapping;wallTex.repeat.set(10,1.6);\nconst wallMat=new THREE.MeshBasicMaterial({map:wallTex,transparent:true,opacity:.92});\nconst WALL_X=6, WALL_H= ]],INK);\n  line([[ax+(x<0?-0.7:0.7),2.0,z],[ax+(x<0?-0.5:0.5),2.25,z]],INK);\n  line([[ax+(x<0?-0.7:0.7),2.0,z],[ax+(x<0?-0.55:0.55),1.7,z]],INK);\n  const hit=new THREE.Mesh(new THREE.PlaneGeometry(1.8,3.2),new THREE.MeshBasicMaterial({transparent:true,opacity:0,side:THREE.DoubleSide}));\n  hit.position.set(0,1.55,0.1);hit.userData={action};g.add(hit);clickable.push(hit);\n  return g;\n}\nsideDoor('ABOUT',-6,3,'about');\nsideDoor('TOOLKIT',6,-6,'tools');\nsideDoor('CONTACT',-6,-16,'contact');\n\n/* ============================== GALLERY (framed posters + city skyline) ============================== */\nconst gallery=new THREE.Group();scene.add(gallery);\n// back wall\nconst galleryWall=new THREE.Mesh(new THREE.PlaneGeometry(14,8),wallMat.clone());galleryWall.position.set(0,4,-55.4);gallery.add(galleryWall);\nbox(0,4,-55.35,14,8,0.02,SOFT,gallery);\n// city skyline strip drawn below the frames\nconst cityTex=tex(1024,256,(x)=>{\n  x.clearRect(0,0,1024,256);x.strokeStyle='rgba(42,42,42,.5)';x.lineWidth=2;const R=rnd(55);\n  let bx=0;while(bx<1024){const bw=30+R()*70,bh=60+R()*150;x.strokeRect(bx,256-bh,bw,bh);\n    // windows\n    x.lineWidth=1;for(let wy=256-bh+10;wy<250;wy+=16){for(let wx=bx+6;wx<bx+bw-6;wx+=14){if(R()>.4)x.strokeRect(wx,wy,7,9);}}x.lineWidth=2;bx+=bw+4;}\n});\nconst city=new THREE.Mesh(new THREE.PlaneGeometry(14,3),new THREE.MeshBasicMaterial({map:cityTex,transparent:true}));city.position.set(0,1.5,-54.9);gallery.add(city);\n// clouds\nconst cloudTex=tex(256,128,(x)=>{x.clearRect(0,0,256,128);x.strokeStyle='rgba(42,42,42,.4)';x.lineWidth=3;x.beginPath();x.moveTo(30,90);x.bezierCurveTo(0,90,10,50,50,54);x.bezierCurveTo(60,20,120,24,130,54);x.bezierCurveTo(180,30,220,50,210,80);x.bezierCurveTo(240,84,236,110,200,108);x.lineTo(40,108);x.bezierCurveTo(20,108,20,94,30,90);x.stroke();});\nfor(let i=0;i<5;i++){const cl=new THREE.Sprite(new THREE.SpriteMaterial({map:cloudTex,transparent:true,depthTest:false,opacity:.85}));cl.position.set((i-2)*3.2+(rnd(i+1)()-.5),6.4+((i%2)?0.4:0),-54.6);cl.scale.set(2.6,1.3,1);cl.userData={drift:0.1+rnd(i*3)()*0.1,x0:cl.position.x};gallery.add(cl);gallery.userData.clouds=(gallery.userData.clouds||[]);gallery.userData.clouds.push(cl);}\n// outdoor sky clouds near the entry facade\n[[-3.6,6.3,11],[3.2,6.7,10.4],[0.2,7.1,11.6],[5.2,5.6,10]].forEach(c=>{const cl=new THREE.Sprite(new THREE.SpriteMaterial({map:cloudTex,transparent:true,depthTest:false,opacity:.8}));cl.position.set(c[0],c[1],c[2]);cl.scale.set(2.9,1.45,1);scene.add(cl);});\n// framed project posters\nfunction posterTexture(i){const p=projects[i];const c=document.createElement('canvas');c.width=360;c.height=460;const x=c.getContext('2d');\n  x.fillStyle='#f4f2ec';x.fillRect(0,0,360,460);x.strokeStyle='#2a2a2a';x.lineWidth=3;x.strokeRect(10,10,340,440);\n  // header title\n  x.fillStyle='#2a2a2a';x.font='bold 22px \"Courier New\",monospace';x.textAlign='left';\n  const words=p[0].toUpperCase().split(' ');let ln='',ly=48;for(const w of words){const test=ln+w+' ';if(x.measureText(test).width>300&&ln){x.fillText(ln.trim(),28,ly);ln=w+' ';ly+=26}else ln=test}x.fillText(ln.trim(),28,ly);\n  x.strokeStyle='#2a2a2a';x.lineWidth=1.5;x.beginPath();x.moveTo(28,ly+14);x.lineTo(332,ly+14);x.stroke();\n  // mini chart art\n  const oy=ly+40,oh=220,ox=32,ow=296;x.save();x.translate(ox,oy);const m=i%6;const rr=n=>{const v=Math.sin((i+1)*77.3+n*29.1)*1e4;return v-Math.floor(v)};\n  x.strokeStyle='#2a2a2a';x.lineWidth=2.4;x.beginPath();x.moveTo(6,6);x.lineTo(6,oh-6);x.lineTo(ow-6,oh-6);x.stroke();x.lineWidth=2;\n  if(m===0){for(let k=0;k<6;k++){const h=24+rr(k)*150;x.fillStyle='rgba(42,42,42,.1)';x.fillRect(20+k*45,oh-6-h,32,h);x.strokeRect(20+k*45,oh-6-h,32,h);}}\n  else if(m===1){x.beginPath();for(let k=0;k<=7;k++){const px=16+k*40,py=oh-24-rr(k)*150;k?x.lineTo(px,py):x.moveTo(px,py)}x.stroke();}\n  else if(m===2){x.beginPath();x.arc(ow/2,oh/2,72,0,6.28);x.stroke();x.beginPath();x.arc(ow/2,oh/2,30,0,6.28);x.stroke();x.beginPath();x.moveTo(ow/2,oh/2);x.lineTo(ow/2+72,oh/2);x.moveTo(ow/2,oh/2);x.lineTo(ow/2+26,oh/2-66);x.stroke();}\n  else if(m===3){for(let k=0;k<14;k++){x.beginPath();x.arc(30+rr(k)*(ow-60),24+rr(k+7)*(oh-56),6,0,6.28);x.stroke();}}\n  else if(m===4){x.beginPath();x.moveTo(10,oh-6);for(let k=0;k<=7;k++)x.lineTo(16+k*40,oh-26-rr(k)*140);x.lineTo(ow-10,oh-6);x.closePath();x.fillStyle='rgba(42,42,42,.1)';x.fill();x.stroke();}\n  else{for(let a=0;a<3;a++)for(let cc=0;cc<6;cc++){x.globalAlpha=rr(a*6+cc)>.5?1:.28;x.fillStyle='rgba(42,42,42,.5)';x.fillRect(18+cc*46,14+a*66,40,58);x.globalAlpha=1;x.strokeRect(18+cc*46,14+a*66,40,58);}}\n  x.restore();\n  // footer meta\n  x.fillStyle='#2a2a2a';x.font='12px \"Courier New\",monospace';x.textAlign='left';x.fillText(p[2][0].toUpperCase(),28,438);x.textAlign='right';x.fillText(tagFor(p[4]),332,438);\n  x.font='bold 18px \"Courier New\",monospace';x.textAlign='left';x.fillText(String(i+1).padStart(2,'0'),28,oy+oh+34);\n  const t=new THREE.CanvasTexture(c);t.minFilter=THREE.LinearFilter;t.anisotropy=renderer.capabilities.getMaxAnisotropy?.()||4;return t}\nconst frames=[];const FW=1.75,FH=2.24;const perRow=8;\nprojects.forEach((p,i)=>{const col=i%perRow,row=Math.floor(i/perRow);\n  const gx=(col-(perRow-1)/2)*1.62;const gy=5.1-row*2.7;const gz=-55.2;\n  const g=new THREE.Group();g.position.set(gx,gy,gz);\n  const art=new THREE.Mesh(new THREE.PlaneGeometry(FW,FH),new THREE.MeshBasicMaterial({map:posterTexture(i)}));g.add(art);\n  const outline=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(FW+0.09,FH+0.09)),INK);outline.position.z=0.02;g.add(outline);\n  // hanging string to a rail\n  const railY=6.7;line([[gx-0.001,railY,gz+0.05],[gx-0.4,gy+FH/2,gz+0.05]],SOFT);line([[gx+0.001,railY,gz+0.05],[gx+0.4,gy+FH/2,gz+0.05]],SOFT);\n  const hit=new THREE.Mesh(new THREE.PlaneGeometry(FW+0.1,FH+0.1),new THREE.MeshBasicMaterial({transparent:true,opacity:0,side:THREE.DoubleSide}));hit.position.z=0.06;hit.userData={project:i};g.add(hit);clickable.push(hit);\n  g.userData={hx:gx,hy:gy,hz:gz,hr:0};frames.push(g);gallery.add(g);\n});\n// rail line across the wall\nline([[-6.6,6.7,-55.15],[6.6,6.7,-55.15]],SOFT,gallery);\nconst galleryTitle=labelSprite('THE GALLERY',{size:70,pad:0.34});galleryTitle.position.set(0,7.5,-55);gallery.add(galleryTitle);\ngallery.visible=true; // frames sit far behind; camera reveals them\n\n/* ============================== NAV / STATE ============================== */\nconst label=document.getElementById('sceneLabel');\nconst hudTitle=document.getElementById('hudTitle'),hudCopy=document.getElementById('hudCopy'),hudKicker=document.getElementById('hudKicker');\nconst galleryTools=document.getElementById('galleryTools');\nconst STOPS={entry:30, about:6, tools:-3, contact:-13, gallery:-46};\nlet targetZ=30, exploded=false, autoWalk=false, entered=false;\nlet pointerX=0, pointerY=0;\n\nfunction setHUD(place){\n  if(place==='entry'){label.textContent='THE FRONT DOOR';hudKicker.textContent='SANDEEP GADAKARI · AI PRODUCT MANAGEMENT';hudTitle.innerHTML='PRODUCTS BUILT<br>TO MAKE DATA<br>ACTIONABLE.';hudCopy.textContent='Click the door to step inside — or drag/scroll to walk the corridor.';}\n  else if(place==='hero'){label.textContent='WELCOME IN';hudKicker.textContent='HELLO, I\\u2019M';hudTitle.innerHTML='SANDEEP<br>GADAKARI';hudCopy.textContent='\\u2039 data storyteller /\\u203a  —  I turn messy data into dashboards and decisions.';}\n  else if(place==='about'){label.textContent='ABOUT · THE HALLWAY';hudTitle.innerHTML='TURNING DATA<br>INTO DIRECTION.';hudKicker.textContent='01 / ABOUT';hudCopy.textContent='End-to-end product leadership for AI-driven solutions — grounded in Python, SQL, and data strategy.';}\n  else if(place==='tools'){label.textContent='TOOLKIT';hudTitle.innerHTML='WHAT\\u2019S UNDER<br>THE HOOD.';hudKicker.textContent='02 / TOOLKIT';hudCopy.textContent=skills.join(' · ');}\n  else if(place==='contact'){label.textContent='CONTACT';hudTitle.innerHTML='LET\\u2019S MAKE<br>DATA USEFUL.';hudKicker.textContent='03 / CONTACT';hudCopy.textContent='Open to data & BI roles — links on the left, or email '+EMAIL;}\n  else if(place==='gallery'){label.textContent='THE GALLERY · CLICK A FRAME';hudTitle.innerHTML='CASE STUDIES<br>ON THE WALL.';hudKicker.textContent='04 / GALLERY';hudCopy.textContent='Sixteen framed stories of data, automation, and BI — click any frame to open it.';}\n}\nfunction moveTo(place){\n  autoWalk=false;entered=true;\n  targetZ=STOPS[place]!==undefined?STOPS[place]:targetZ;\n  const inGallery=place==='gallery';\n  galleryTools.classList.toggle('on',inGallery);\n  setHUD(place);\n  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.go===place));\n}\ndocument.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>moveTo(b.dataset.go));\n\ndocument.getElementById('explodeBtn').onclick=()=>{exploded=!exploded;const R2=rnd(88);\n  frames.forEach((f,i)=>{const a=i/frames.length*Math.PI*2;const rad=exploded?4.5+R2()*1.6:0;\n    f.userData.tx=exploded?Math.cos(a)*rad:f.userData.hx;f.userData.ty=exploded?4+Math.sin(a)*rad*0.6:f.userData.hy;\n    f.userData.tz=exploded?-52-R2()*3:f.userData.hz;f.userData.tr=exploded?(R2()-.5)*0.8:0;});\n  document.getElementById('explodeBtn').textContent=exploded?'↩ REHANG THE WALL':'✦ EXPLODE THE WALL';};\ndocument.getElementById('rehangBtn').onclick=()=>{if(exploded)document.getElementById('explodeBtn').onclick();moveTo('about');};\n\n/* ---- input: scroll + drag + touch ---- */\naddEventListener('wheel',e=>{autoWalk=false;entered=true;targetZ=THREE.MathUtils.clamp(targetZ+e.deltaY*0.016,-48,24)},{passive:true});\nlet dragging=false,lastY=0;\ncanvas.addEventListener('pointerdown',e=>{dragging=true;lastY=e.clientY;autoWalk=false;entered=true;canvas.setPointerCapture(e.pointerId)});\ncanvas.addEventListener('pointerup',()=>dragging=false);\ncanvas.addEventListener('pointermove',e=>{pointerX=e.clientX/innerWidth-0.5;pointerY=e.clientY/innerHeight-0.5;pointer.x=pointerX*2;pointer.y=-pointerY*2;\n  if(dragging){targetZ=THREE.MathUtils.clamp(targetZ+(e.clientY-lastY)*0.03,-48,24);lastY=e.clientY;}});\n// click to enter doors / open frames (ignore drags)\nlet downX=0,downY=0;\ncanvas.addEventListener('pointerdown',e=>{downX=e.clientX;downY=e.clientY});\ncanvas.addEventListener('click',e=>{if(Math.abs(e.clientX-downX)>6||Math.abs(e.clientY-downY)>6)return;\n  raycaster.setFromCamera(pointer,camera);const hit=raycaster.intersectObjects(clickable,true)[0];if(!hit)return;const d=hit.object.userData;\n  if(Number.isInteger(d.project))openProject(d.project);else if(d.action==='enter'){moveTo('hero');targetZ=8;}else if(d.action)moveTo(d.action);});\naddEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});\n\n/* ---- auto-region HUD as you walk freely ---- */\nfunction autoRegion(z){\n  if(z>18) return 'entry';\n  if(z>7) return 'hero';\n  if(z>0) return 'about';\n  if(z>-9) return 'tools';\n  if(z>-28) return 'contact';\n  return 'gallery';\n}\nlet lastRegion='entry';\n\n/* ============================== RENDER LOOP ============================== */\nlet t=0;\nfunction animate(){requestAnimationFrame(animate);t+=0.016;\n  // gentle auto-walk on load to draw the viewer in\n  if(autoWalk){targetZ-=0.028;if(targetZ<=8){targetZ=8;autoWalk=false;}}\n  camera.position.z+=(targetZ-camera.position.z)*0.055;\n  camera.position.x+=(pointerX*0.5-camera.position.x)*0.05;\n  camera.position.y+=(1.62-pointerY*0.28-camera.position.y)*0.05;\n  camera.lookAt(camera.position.x*0.15,1.75,camera.position.z-8);\n  // facade fade + door swing as you pass through\n  const passed=THREE.MathUtils.clamp((12-camera.position.z)/5,0,1);\n  facadeWall.material.opacity=1-passed*0.9;fMat.opacity=1-passed*0.9;\n  doorL.rotation.y=-passed*1.2;doorR.rotation.y=passed*1.2;\n  facade.visible=camera.position.z>5;\n  // hero float + doodles\n  heroGroup.position.y=2.2+Math.sin(t*0.9)*0.06;\n  heroGroup.rotation.y=Math.sin(t*0.35)*0.06;\n  sparks.forEach((s,i)=>{const k=0.7+Math.sin(t*2.4+s.userData.phase)*0.35;s.scale.set(s.userData.base*k,s.userData.base*k,1);s.material.rotation=t*0.4+i;});\n  airplane.position.x=2.6+Math.sin(t*0.7)*1.1;airplane.position.y=1.7+Math.cos(t*0.9)*0.5;airplane.material.rotation=Math.sin(t*0.7)*0.3;\n  // clouds drift\n  (gallery.userData.clouds||[]).forEach(cl=>{cl.position.x+=cl.userData.drift*0.01;if(cl.position.x>7)cl.position.x=-7;});\n  // frames ease to explode/rehang\n  frames.forEach(f=>{if(f.userData.tx!==undefined){f.position.x+=(f.userData.tx-f.position.x)*0.06;f.position.y+=(f.userData.ty-f.position.y)*0.06;f.position.z+=(f.userData.tz-f.position.z)*0.06;f.rotation.z+=((f.userData.tr||0)-f.rotation.z)*0.06;}});\n  // HUD follows free walking (unless a nav target set it)\n  const reg=autoRegion(camera.position.z);\n  if(reg!==lastRegion){lastRegion=reg;setHUD(reg);const inG=reg==='gallery';galleryTools.classList.toggle('on',inG);document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.go===reg||(reg==='hero'&&b.dataset.go==='entry')));}\n  renderer.render(scene,camera);\n}\nsetHUD('entry');\nanimate();\n// hand off loader once first frame is drawn, then begin the auto dolly-through after a hold\nrequestAnimationFrame(()=>{sceneReady=true;setProgress(94);setTimeout(finishLoad,500);});\nsetTimeout(()=>{if(!entered)autoWalk=true;},2600);\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
